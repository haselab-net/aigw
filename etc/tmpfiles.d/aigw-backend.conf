# Deploy as /etc/tmpfiles.d/aigw-backend.conf (see phase0/the design notes for the
# exact deployment order).
#
# /run/aigw-backend/ has to exist before aigw-backend-proxy@<port>.socket can
# bind its own activation socket there (ListenStream=/run/aigw-backend/%i.sock
# -- see that unit), and that binding happens at boot (WantedBy=sockets.target)
# independently of whether any aigw-backend@<user>.service has ever actually
# run -- the whole point of socket activation is that it hasn't, the first
# time. So this can't be an ExecStartPre on aigw-backend@.service (as
# aigw-root-tmux@.service does for its own /run/aigw-root-tmux/, and as an
# earlier revision of this fix tried here too): that would only run once some
# backend actually starts, which is too late for the *first* connection ever
# made on this host after a reboot. systemd-tmpfiles runs during early boot,
# before sockets.target, which is early enough.
#
# Mode 1777, not 0755: every aigw-backend@<user> is a different Unix user and
# needs to create its OWN "<user>-backend.sock" file directly in this shared
# directory (see aigw-backend's BACKEND_SOCKET_PATH) -- 0755 only lets the
# owner (root) do that, so a non-root user's own bind() would fail with
# EACCES. 1777 is the same world-writable-but-sticky shape already used for
# /run/aigw-ssh-mux (aigw-backend@.service) and /tmp itself: anyone can create
# a file here, the sticky bit stops anyone but its own owner (or root) from
# removing or renaming someone else's. This directory being world-writable
# does NOT reopen the hole this migration closes -- the access control that
# matters is each socket FILE's own permission bits (aigw-backend-proxy@
# <port>.socket's activation socket is owner "aigw" mode 0600; aigw-backend's
# own real socket is owner-only mode 0600 -- see both units/aigw-backend
# itself), not who can see or create sibling files in the directory that
# holds them.
d /run/aigw-backend 1777 root root -
